name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.sum

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Compile okf Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BINARY_NAME="okf"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="okf.exe"
          fi

          mkdir -p build_output
          cd src
          go build -ldflags="-s -w -X main.version=${TAG}" -o "../build_output/${BINARY_NAME}" ./cmd/okf
          cd ..

      - name: Package Archive and Standalone Binary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE_NAME="okf_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist

          cd build_output
          # Standalone uncompressed binary for 1-line curl install (e.g. Google Colab / Docker)
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp okf.exe "../dist/okf-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
            zip -9 "../dist/${ARCHIVE_NAME}.zip" okf.exe
          else
            cp okf "../dist/okf-${{ matrix.goos }}-${{ matrix.goarch }}"
            tar -czvf "../dist/${ARCHIVE_NAME}.tar.gz" okf
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
